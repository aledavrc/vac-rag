[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vacuinfo"
version = "0.1.0"
description = "Consulta con RAG de la NTS N° 246-MINSA/DGIESP-2026"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "chromadb==1.5.9",
    "fastembed==0.9.1",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3",
    "httpx>=0.27",
    "orjson>=3.10",
    "rich>=13",
]

[project.optional-dependencies]
ingest = [
    "ocrmypdf>=17",
    "docling>=2.149",
    "pypdf>=5",
]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
vacuinfo = "vacuinfo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vacuinfo"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
